[project]
name = "agent-judge"
version = "0.1.0"
description = "Evidence-aware agent judge built on PydanticAI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-ai>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
agent-judge-server = "agentjudge.server:main"
